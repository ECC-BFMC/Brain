<div class="local-firmware-settings">
  <div *ngIf="statusMessage" class="status-message" [class.success]="statusType === 'success'"
    [class.error]="statusType === 'error'" [class.info]="statusType === 'info'">
    {{ statusMessage }}
  </div>

  <div class="firmware-row">
    <div class="firmware-controls">
      <label for="local-firmware-file">Firmware File</label>
      <select id="local-firmware-file" [(ngModel)]="selectedLocalFirmwareName" [disabled]="isLoading || isFlashing || localFirmwareFiles.length === 0">
        <option value="" disabled>Select a local .bin file</option>
        <option *ngFor="let file of localFirmwareFiles" [value]="file.name">
          {{ file.name }}
        </option>
      </select>
    </div>

    <div class="firmware-actions">
      <button class="btn-refresh" type="button" (click)="loadLocalFirmwareFiles()" [disabled]="isLoading || isFlashing"
        aria-label="Refresh local firmware file list">
        <svg *ngIf="!isLoading" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
        </svg>
        <svg *ngIf="isLoading" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="spinning">
          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
        </svg>
      </button>

      <button class="btn-flash" type="button" (click)="flashSelectedFirmware()"
        [disabled]="isLoading || isFlashing || !selectedLocalFirmwareName">
        <svg *ngIf="!isFlashing" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 2v11h3v9l7-12h-4l4-8z" />
        </svg>
        <svg *ngIf="isFlashing" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="spinning">
          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
        </svg>
        <span>{{ isFlashing ? 'Flashing...' : 'Flash Selected Bin' }}</span>
      </button>
    </div>
  </div>

  <div *ngIf="selectedLocalFirmware as file" class="firmware-details">
    <div class="detail-row">
      <span class="detail-label">Selected</span>
      <span class="detail-value file-name">{{ file.name }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Size</span>
      <span class="detail-value">{{ formatFileSize(file.size) }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Modified</span>
      <span class="detail-value">{{ formatDate(file.modified_at) }}</span>
    </div>
    <div *ngIf="file.is_default" class="detail-row">
      <span class="detail-label">Default</span>
      <span class="detail-value tag">robot_car.bin</span>
    </div>
  </div>

  <div *ngIf="!isLoading && localFirmwareFiles.length === 0" class="empty-state">
    No local <code>.bin</code> files were found in <code>src/hardware/firmware</code>.
  </div>

  <div class="info-note">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
    </svg>
    <span>Use this section to flash any local firmware binary already present in <code>src/hardware/firmware</code>.</span>
  </div>
</div>
