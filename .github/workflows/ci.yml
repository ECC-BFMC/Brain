name: CI

on:
  pull_request:
    branches: [master, "2027"]

jobs:
  python:
    name: Python (lint + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile smoke test
        run: python -m compileall -q main.py newComponent.py src

  tests:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pytest-cov numpy "scipy>=1.15,<2" "Flask>=3.1,<3.2" "PyYAML>=6,<7" "pyserial==3.5" opencv-python-headless

      - name: Run unit tests
        run: pytest

  frontend:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dashboard/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
